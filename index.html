async function migUse(o,kind){const M=MIG;M.kind=kind;M.src=o;M.fp=fpr(o);M.aud=audit(o);M.bk=null;M.plan=null;M.res=null;M.err='';M.prog={};M.deleted=false;try{M.pre=await Cloud.migration.precheck()}catch(e){M.pre=null;M.err=arErr(e)}render()}

function migBackup(){const M=MIG;if(!M.src)return;const created=new Date().toISOString(),txt=JSON.stringify({...M.src,_meta:{kind:'pre-supabase-migration',created,counts:cnt(M.src),fingerprint:M.fp}},null,1);let back;try{back=JSON.parse(txt)}catch(e){return alert('فشل التحقق من النسخة')}if(fpr(back)!=M.fp)return alert('فشل التحقق: النسخة غير مطابقة للمصدر');dl(txt,'halaqa_PRE-MIGRATION_'+stamp()+'.json','application/json');M.bk=M.fp;render()}
async function migRun(){const M=MIG;if(M.busy||!M.src)return;if(M.aud&&M.aud.E.length)return alert('توجد أخطاء في المصدر تمنع النقل. افتح تقرير الفحص وأصلحها أولًا.');if(!(M.bk&&M.bk==M.fp))return alert('نزّل نسخة JSON الاحتياطية من المصدر أولًا (الخطوة 2): هي شرط إلزامي قبل النقل.');if(M.pre&&M.pre.foreign)return alert('الحلقة السحابية تحتوي طلابًا أُضيفوا يدويًا؛ لا يبدأ النقل لمنع خلط البيانات.');if(Cloud.status().pending)return alert('توجد تغييرات سحابية لم تُرسل بعد، انتظر اكتمالها ثم أعد المحاولة.');
if(!confirm('سيبدأ نقل '+M.src.students.length+' طالب و'+M.src.logs.length+' سجل إلى الحلقة السحابية. العملية قابلة للإعادة ولا تحذف أي بيانات محلية. متابعة؟'))return;
M.busy=true;M.res=null;M.err='';M.prog={};render();const pg=(k,d,n)=>{M.prog[k]=[d,n];const e=$('#mg_prog');if(e)e.innerHTML=progHtml()};

catch(e){M.err=arErr(e)}finally{M.busy=false}render()}
function migDeleteLocal(){const M=MIG;if(!(M.res&&M.res.ok&&M.kind=='local'))return alert('لا يُتاح الحذف قبل نجاح التحقق وللمصدر المحلي.');const cur=LocalAdapter.load();if(!cur||fpr({...cur,recs:cur.recs||{}})!=M.fp)return alert('تغيّرت البيانات المحلية بعد النقل. أعد النقل والتحقق أولًا.');if(prompt('لحذف بيانات هذا الجهاز نهائيًا اكتب كلمة: احذف')!=='احذف')return;localStorage.removeItem(K);M.deleted=true;render()}

return`<h1>👪 أولياء الأمور</h1><div class=warn>اسم المستخدم لولي الأمر هو <b>رقم جواله</b>. عند «إنشاء حساب» تُولَّد له كلمة مرور مؤقتة عشوائية تظهر لك مرة واحدة، ويُطلب منه تغييرها عند أول دخول. لا يرى ولي الأمر إلا بيانات أبنائه المرتبطين به، للقراءة فقط. لا تستخدم كلمة مرور موحّدة معروفة لجميع الأولياء: من يعرف رقم الجوال سيدخل ويرى بيانات الأبناء.</div>
<div class=tool><button class=b onclick="gdForm()">+ إضافة ولي أمر</button><button class="b s" onclick="loadGD(true)">🔄 تحديث</button></div><div class=panel>${tb(['الاسم','رقم الجوال (اسم المستخدم)','الأبناء','الحساب',''],g.map(x=>{const a=st(x.id);return[esc(x.full_name),esc(x.phone||'—'),kids(x.id).map(k=>esc(k.name)).join('، ')||'—',x.user_id?(a.must_change?'<span class="tg y">أُنشئ — لم يغيّر كلمة المرور</span>':'<span class="tg">مفعّل</span>'):'<span class="tg w">لا حساب</span>',`<button class="b m" onclick="gdForm('${x.id}')">تعديل</button> <button class="b m s" onclick="gdLink('${x.id}')">الأبناء</button> ${x.user_id?`<button class="b m s" onclick="gdAcct('reset','${x.id}')">إعادة تعيين كلمة المرور</button>`:`<button class="b m" onclick="gdAcct('create','${x.id}')">إنشاء حساب</button>`} <button class="b m d" onclick="gdDel('${x.id}')">حذف</button>`]}))}</div>`};
function gdForm(id){const g=(id&&GD.rows&&GD.rows.g.find(x=>x.id==id))||{};fm(id?'تعديل ولي أمر':'إضافة ولي أمر',[{k:'name',l:'اسم ولي الأمر',r:1},{k:'phone',l:'رقم الجوال (هو اسم المستخدم)',r:1}],{name:g.full_name,phone:g.phone},o=>{if(Cloud.normPhone(o.phone).length<7){alert('رقم الجوال غير صالح');return false}
(async()=>{try{const nid=await Cloud.guardians.save({id,...o});await loadGD(true);if(!id&&nid&&confirm('تم حفظ ولي الأمر. هل تريد ربطه بأبنائه الآن؟'))gdLink(nid)}catch(e){alert(arErr(e))}})()})}
function gdLink(gid){const cur=GD.rows.sg.filter(x=>x.guardian_id==gid).map(x=>x.student_id);modalMsg(`<h3>ربط الأبناء</h3><div style="max-height:50vh;overflow:auto">${Store.students().map(s=>`<label style="display:block;margin:6px 0"><input type=checkbox class=gd_ck value="${s.id}" ${cur.includes(s.id)?'checked':''}> ${esc(s.name)}</label>`).join('')}</div><p><button class=b onclick="gdLinkSave('${gid}',this)">حفظ</button></p>`)}
async function gdLinkSave(gid,btn){const cur=GD.rows.sg.filter(x=>x.guardian_id==gid).map(x=>x.student_id),ids=[...document.querySelectorAll('.gd_ck:checked')].map(e=>e.value);try{await Cloud.guardians.setChildren(gid,ids,cur);if(btn&&btn.closest)btn.closest('.md').remove();await loadGD(true)}catch(e){alert(arErr(e))}}
const gdErr=e=>({phone_required:'أضف رقم جوال صالحًا لولي الأمر أولًا (تعديل).',already_has_account:'لهذا الولي حساب بالفعل.',no_account:'لا حساب لهذا الولي بعد.',forbidden:'غير مصرّح لك بإدارة هذا الحساب.',shared_account:'هذا الحساب مرتبط بأولياء أمور في حلقات أخرى ولا يمكنك إعادة تعيين كلمة مروره.',unauthorized:'انتهت الجلسة، سجّل الدخول من جديد.'}[e&&e.code]||(e&&e.status==404?'تعذّر الوصول إلى دالة إنشاء الحسابات (guardian-accounts) على الخادم.':arErr(e)));
async function gdAcct(action,gid){const g=GD.rows.g.find(x=>x.id==gid);if(action=='reset'&&!confirm('ستُولَّد كلمة مرور مؤقتة جديدة وتتعطل القديمة، ويُطلب من ولي الأمر تغييرها عند دخوله. متابعة؟'))return;
try{const r=await Cloud.guardians.account(action,gid);await loadGD(true);showCreds(g,r)}catch(e){alert(gdErr(e))}}
function showCreds(g,r){const url=(window.HALAQA_CONFIG.appUrl||location.href).split('#')[0],name=Store.settings().halaqa||'الحلقة';
if(r.existing)return modalMsg(`<h3>تم ربط الحساب</h3><p>هذا الرقم له حساب سابق (ولي أمر لأبناء آخرين) وقد رُبط بهذا الولي. يدخل بكلمة مروره الحالية ولم تتغير.</p><p>اسم المستخدم: <b dir=ltr>${esc(g.phone)}</b></p>`);
const msg=`السلام عليكم ورحمة الله،\nحساب متابعة أبنائكم في ${name}:\nالرابط: ${url}\nاسم المستخدم (رقم الجوال): ${g.phone}\nكلمة المرور المؤقتة: ${r.password}\nسيُطلب منكم تغيير كلمة المرور عند أول دخول.`;
modalMsg(`<h3>بيانات دخول ولي الأمر</h3><div class=warn>كلمة المرور المؤقتة تظهر <b>هذه المرة فقط</b>. انسخ الرسالة وأرسلها لولي الأمر الآن (واتساب مثلًا).</div><p>اسم المستخدم: <b dir=ltr>${esc(g.phone)}</b><br>كلمة المرور المؤقتة: <b dir=ltr style="font-size:20px">${esc(r.password)}</b></p><textarea id=gd_msg rows=7 readonly style="width:100%">${esc(msg)}</textarea><p><button class=b onclick="gdCopy()">📋 نسخ الرسالة</button></p>${/^file:/.test(location.protocol)&&!window.HALAQA_CONFIG.appUrl?'<div class=err>تنبيه: الصفحة تعمل الآن كملف على جهازك، والرابط أعلاه لن يفتح عند ولي الأمر. استضف الملف على رابط HTTPS ثم ضع رابطه في HALAQA_CONFIG.appUrl.</div>':''}`)}
function gdCopy(){const t=$('#gd_msg');if(t.select)t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand&&document.execCommand('copy')}}
async function gdDel(id){if(!confirm('حذف ولي الأمر وفك ارتباطه بأبنائه؟ (حسابه إن وُجد يبقى دون أي بيانات يراها).'))return;try{await Cloud.guardians.remove(id);await loadGD(true)}catch(e){alert(arErr(e))}}
// ---- المحفّظ: الإعلانات
async function loadAN(force){if(AN.loading)return;if(force){AN.rows=null;AN.err=''}AN.loading=true;try{AN.rows=await Cloud.announcements.list()}catch(e){AN.err=arErr(e)}AN.loading=false;if(S.v=='announce')render()}
V.announce=function(){if(Store.mode()!='cloud')return`<h1>📢 الإعلانات</h1><div class=warn>هذا القسم يعمل في الوضع السحابي فقط.</div>`;if(!AN.rows&&!AN.loading&&!AN.err)loadAN();
if(!AN.rows)return`<h1>📢 الإعلانات</h1><div class=panel>${AN.err?`<div class=err>${esc(AN.err)}</div><button class=b onclick="loadAN(true)">إعادة المحاولة</button>`:'جارٍ التحميل…'}</div>`;
return`<h1>📢 الإعلانات والتنبيهات</h1><div class=warn>تظهر هذه الرسائل لأولياء أمور طلاب حلقتك في بوابتهم الرئيسية.</div><div class=tool><button class=b onclick="anForm()">+ إعلان جديد</button></div><div class=panel>${tb(['النوع','العنوان','النص','من','إلى',''],AN.rows.map(a=>[a.kind=='alert'?'⚠️ تنبيه':'📢 إعلان',esc(a.title),esc(a.body),String(a.starts_at).slice(0,10),a.ends_at?String(a.ends_at).slice(0,10):'مفتوح',`<button class="b m d" onclick="anDel('${a.id}')">حذف</button>`]))}</div>`};
function anForm(){fm('إعلان جديد',[{k:'title',l:'العنوان',r:1},{k:'body',l:'النص',t:'textarea'},{k:'kind',l:'النوع',t:'select',o:[['announcement','إعلان'],['alert','تنبيه']]},{k:'ends',l:'ينتهي بتاريخ (اختياري)',t:'date'}],{kind:'announcement'},o=>{(async()=>{try{await Cloud.announcements.add(o);await loadAN(true)}catch(e){alert(arErr(e))}})()})}
async function anDel(id){if(!confirm('حذف هذا الإعلان؟'))return;try{await Cloud.announcements.remove(id);await loadAN(true)}catch(e){alert(arErr(e))}}
boot()</script></body></html>
